<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Web Clone</title>
<style>
/* ================= Telegram Web clone — all styles inline, no frameworks ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#5682a3;          /* telegram header blue-grey */
  --green:#4dcd5e;           /* unread badge green */
  --tick-blue:#5bb0e8;       /* read ticks */
  --bg:#e7ebf0;              /* chat background */
  --outgoing:#effdde;        /* outgoing bubble */
  --text:#222; --grey:#707579;
}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);overflow:hidden;background:var(--bg)}
#app{display:flex;height:100vh;width:100vw}

/* ---------- LEFT PANEL ---------- */
#sidebar{width:420px;min-width:420px;background:#fff;display:flex;flex-direction:column;border-right:1px solid #e6e9ed}
#searchbar{padding:10px 12px;background:#fff;border-bottom:1px solid #e6e9ed;display:flex;gap:8px;align-items:center}
#menuBtn{width:40px;height:40px;border:none;background:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#menuBtn:hover{background:#f1f4f6}
#searchWrap{flex:1;position:relative}
#search{width:100%;border:none;background:#f1f4f6;border-radius:20px;padding:10px 16px 10px 40px;font-size:14px;outline:none}
#search:focus{background:#e9eef2}
#searchWrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
#chatlist{flex:1;overflow-y:auto}
.chat{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;position:relative}
.chat:hover{background:#f4f6f8}
.chat.active{background:#e8f1f9}
.chat.muted .badge{background:#c4c9cc}
.avatar{width:50px;height:50px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:19px;letter-spacing:.5px}
/* telegram-style gradients */
.g1{background:linear-gradient(135deg,#ff845e,#d45246)} .g2{background:linear-gradient(135deg,#6ab2e8,#3f7db5)}
.g3{background:linear-gradient(135deg,#7ed321,#4a9e1e)} .g4{background:linear-gradient(135deg,#b06ab3,#7b4b94)}
.g5{background:linear-gradient(135deg,#ffa940,#e07b1f)} .g6{background:linear-gradient(135deg,#5ac8fa,#2f80ed)}
.g7{background:linear-gradient(135deg,#ff6b9d,#c93a6e)} .g8{background:linear-gradient(135deg,#4dd0a6,#2a9e76)}
.chat .info{flex:1;min-width:0}
.chat .top{display:flex;justify-content:space-between;align-items:baseline}
.chat .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .time{font-size:12px;color:var(--grey);flex-shrink:0;margin-left:8px}
.chat .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.chat .snippet{font-size:14px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.snippet .tick{font-size:13px}
.badge{background:var(--green);color:#fff;font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;margin-left:8px;flex-shrink:0}
.muteIcon{color:#b8bdc1;margin-left:6px}
.empty-list{padding:32px;text-align:center;color:var(--grey);font-size:14px}

/* ---------- RIGHT PANE ---------- */
#chatpane{flex:1;display:flex;flex-direction:column;min-width:0}
#cheader{background:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #e6e9ed}
#cheader .avatar{width:44px;height:44px;font-size:17px;cursor:pointer}
#ctitle{flex:1;min-width:0;cursor:pointer}
#ctitle .name{font-weight:700;font-size:16px}
#ctitle .status{font-size:13px;color:var(--accent)}
#ctitle .status.typing{color:var(--accent);font-style:italic}
.iconbtn{width:40px;height:40px;border:none;background:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--grey)}
.iconbtn:hover{background:#f1f4f6}
.iconbtn svg{width:22px;height:22px}

#messages{flex:1;overflow-y:auto;padding:16px 8%;position:relative;
  /* subtle telegram-ish dot pattern over the flat background */
  background-color:var(--bg);
  background-image:radial-gradient(#d5dbe2 1px, transparent 1px);
  background-size:22px 22px}
#msgsInner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.datebubble{align-self:center;background:#c9d4dc;color:#5a6a78;font-size:12.5px;font-weight:600;padding:5px 14px;border-radius:14px;margin:8px 0}
.msg{max-width:65%;padding:8px 12px 6px;border-radius:10px;font-size:14.5px;line-height:1.45;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word}
.msg.in{background:#fff;align-self:flex-start;border-top-left-radius:3px}
.msg.out{background:var(--outgoing);align-self:flex-end;border-top-right-radius:3px}
.msg .sender{font-weight:700;font-size:13.5px;margin-bottom:2px}
.msg .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;color:#8a9aa8;margin-top:4px;float:right;margin-left:10px}
.msg .body{display:inline}
.ticks{font-size:13px;letter-spacing:-2px}
.ticks.sent{color:#8a9aa8}
.ticks.read{color:var(--tick-blue)}
.clear{clear:both}

/* welcome placeholder */
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:14px;color:var(--grey)}
#welcome .ball{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#5ac8fa,#2f80ed);display:flex;align-items:center;justify-content:center}
#welcome p{font-size:15px}

/* ---------- INPUT BAR ---------- */
#inputbar{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:6px;border-top:1px solid #e6e9ed}
#inputbar .iconbtn{color:#8a9aa8}
#msgInput{flex:1;border:none;outline:none;font-size:15px;padding:12px 16px;background:#f1f4f6;border-radius:22px;font-family:inherit}
#sendBtn{background:var(--accent)}
#sendBtn svg{stroke:#fff}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#c4cdd4;border-radius:3px}
@media(max-width:760px){#sidebar{width:100%;min-width:0}#chatpane{display:none}}
</style>
</head>
<body>
<div id="app">
  <!-- ============ LEFT: chat list ============ -->
  <div id="sidebar">
    <div id="searchbar">
      <button id="menuBtn" title="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#707579" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div id="searchWrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#707579" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="search" placeholder="Search" autocomplete="off">
      </div>
    </div>
    <div id="chatlist"></div>
  </div>

  <!-- ============ RIGHT: conversation ============ -->
  <div id="chatpane">
    <div id="welcome">
      <div class="ball">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="#fff"><path d="M21.9 4.6 18.8 19c-.2 1-.8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.9.4l.3-4.6L18.3 7c.4-.3-.1-.5-.6-.2L7.6 13.2 3.2 11.8c-1-.3-1-1 .2-1.4l17.2-6.6c.8-.3 1.5.2 1.3.8z"/></svg>
      </div>
      <p>Select a chat to start messaging</p>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================================================================
   Telegram Web clone — vanilla JS, zero dependencies, all inline.
   Data model: chats -> messages. Bot replies simulate a live peer.
   ================================================================ */

/* ---------- seeded data: 7 chats with realistic histories ---------- */
const CHATS = [
  {
    id:'arjun', name:'Arjun Mehta', grad:'g1', status:'online', muted:false,
    unread:2,
    replies:[
      'Haha exactly 😂','Sounds good, let me check and get back to you',
      'No way, send me the link!','Okay cool, talk later then 👍','Deal. See you there!'],
    messages:[
      {from:'them', text:'Bro did you see the match last night??', time:'21:14'},
      {from:'me',   text:'Only the highlights. That last over was insane', time:'21:20'},
      {from:'them', text:'I was screaming at the TV 😂 Kohli is unreal', time:'21:21'},
      {from:'them', text:'Btw are we still on for Saturday? Need to book the turf', time:'21:42'},
    ]
  },
  {
    id:'squad', name:'Weekend Squad', grad:'g2', status:'5 members', group:true, muted:false,
    unread:4,
    replies:['+1 for that','I\'m in, count me 🙋','lol classic','Can we do Sunday instead?','On my way, 10 mins'],
    messages:[
      {from:'them', sender:'Priya', color:'#d45246', text:'Guys, trek this Sunday? Nandi Hills, sunrise batch 🌄', time:'08:02'},
      {from:'them', sender:'Rahul', color:'#2f80ed', text:'I\'m in! What time do we leave?', time:'08:15'},
      {from:'them', sender:'Priya', color:'#d45246', text:'Pickup at 4:30 AM from Silk Board. Carry water + snacks', time:'08:16'},
      {from:'me',   text:'4:30 AM 😭 fine, I\'ll set 3 alarms', time:'08:31'},
      {from:'them', sender:'Sneha', color:'#7b4b94', text:'Haha same. Also who\'s bringing the speaker?', time:'09:05'},
      {from:'them', sender:'Rahul', color:'#2f80ed', text:'I got the speaker + playlist ready 🎶', time:'09:12'},
    ]
  },
  {
    id:'technews', name:'Tech News', grad:'g6', status:'128k subscribers', channel:true, muted:true,
    unread:0,
    replies:[],
    messages:[
      {from:'them', text:'🚀 Open-source model "Falcon-3" just dropped — beats GPT-4o-mini on MMLU, fully MIT licensed.', time:'10:00'},
      {from:'them', text:'📱 Android 17 beta adds on-device AI summaries for every app. Pixel 10 first in line.', time:'11:30'},
      {from:'them', text:'💻 Reminder: our "Build a database in a weekend" workshop stream starts in 1 hour.', time:'12:45'},
    ]
  },
  {
    id:'saved', name:'Saved Messages', grad:'g4', status:'', muted:false,
    unread:0,
    replies:[],
    messages:[
      {from:'me', text:'🔖 Renew domain: rehan.dev — expires Oct 12', time:'09:00'},
      {from:'me', text:'📝 Ideas for the portfolio: 1) game engine demo 2) raft visualizer 3) write the blog post', time:'09:05'},
      {from:'me', text:'https://github.com/ozrehan/build-your-own-everything', time:'09:06'},
    ]
  },
  {
    id:'diya', name:'Diya Sharma', grad:'g7', status:'last seen recently', muted:false,
    unread:0,
    replies:['Aww thanks! 🥰','Let\'s do it, Friday works for me','Sending it now, one sec','Haha you always say that'],
    messages:[
      {from:'me',   text:'Happy birthday!! 🎂 Hope the cake survived the candles this year', time:'00:01'},
      {from:'them', text:'HAHA thank youu! It did, barely. 24 candles is a fire hazard', time:'09:44'},
      {from:'me',   text:'Dinner on me this weekend to celebrate properly?', time:'09:50'},
      {from:'them', text:'You don\'t have to ask twice 😌 Friday?', time:'10:02'},
    ]
  },
  {
    id:'kabir', name:'Kabir Singhania', grad:'g5', status:'last seen 2 hours ago', muted:true,
    unread:0,
    replies:['noted','will do','ok'],
    messages:[
      {from:'them', text:'Standup moved to 10:30 tomorrow, client call at 11', time:'18:20'},
      {from:'me',   text:'Got it, I\'ll have the API docs ready by then', time:'18:35'},
    ]
  },
  {
    id:'mom', name:'Mom ❤️', grad:'g8', status:'online', muted:false,
    unread:1,
    replies:['Beta, khana kha liya? 🍛','Call when free, papa wants to talk','Good night, take care 😘'],
    messages:[
      {from:'them', text:'Did you eat properly today?', time:'13:05'},
      {from:'me',   text:'Yes maa, had dal and rice 😊', time:'13:20'},
      {from:'them', text:'Good. Your cousin is coming to Bangalore next week, you should meet him', time:'13:22'},
    ]
  },
];

/* ---------- state ---------- */
let activeId = null;          // currently open chat
let replyIndex = {};          // rotating reply cursor per chat

const $ = id => document.getElementById(id);
const chatList = $('chatlist'), pane = $('chatpane');

/* ---------- helpers ---------- */
function initials(name){
  return name.replace(/[^A-Za-z ]/g,'').trim().split(/\s+/)
    .map(w=>w[0]).join('').slice(0,2).toUpperCase() || '?';
}
function esc(s){ // prevent HTML injection from input
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function nowTime(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function lastMsg(c){
  const m=c.messages[c.messages.length-1];
  return m||{text:'',time:'',from:''};
}

/* ================================================================
   LEFT PANEL — chat list
   ================================================================ */
function renderList(filter=''){
  chatList.innerHTML='';
  const q=filter.trim().toLowerCase();
  const visible=CHATS.filter(c=>!q || c.name.toLowerCase().includes(q) ||
    c.messages.some(m=>m.text.toLowerCase().includes(q)));
  if(!visible.length){
    chatList.innerHTML='<div class="empty-list">No chats found</div>';
    return;
  }
  for(const c of visible){
    const lm=lastMsg(c);
    const row=document.createElement('div');
    row.className='chat'+(c.id===activeId?' active':'')+(c.muted?' muted':'');
    row.onclick=()=>openChat(c.id);
    let snippet=esc(lm.text);
    if(lm.from==='me' && !c.channel) snippet='<span class="tick">✓✓</span> '+snippet;
    if(c.group && lm.sender) snippet='<b>'+esc(lm.sender.split(' ')[0])+':</b> '+snippet;
    row.innerHTML=
      '<div class="avatar '+c.grad+'">'+initials(c.name)+'</div>'+
      '<div class="info"><div class="top"><span class="name">'+esc(c.name)+'</span>'+
      '<span class="time">'+lm.time+'</span></div>'+
      '<div class="bottom"><span class="snippet">'+snippet+'</span>'+
      (c.unread?'<span class="badge">'+c.unread+'</span>':'')+
      (c.muted?'<svg class="muteIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>':'')+
      '</div></div>';
    chatList.appendChild(row);
  }
}
$('search').addEventListener('input', e=>renderList(e.target.value));

/* ================================================================
   RIGHT PANE — conversation view
   ================================================================ */
function openChat(id){
  const c=CHATS.find(x=>x.id===id);
  activeId=id; c.unread=0;             // opening clears the unread badge
  renderList($('search').value);

  pane.innerHTML=
    '<div id="cheader">'+
      '<div class="avatar '+c.grad+'">'+initials(c.name)+'</div>'+
      '<div id="ctitle"><div class="name">'+esc(c.name)+'</div>'+
      '<div class="status" id="cstatus">'+esc(c.status)+'</div></div>'+
      '<button class="iconbtn" title="Search">'+svgSearch+'</button>'+
      '<button class="iconbtn" title="Call">'+svgPhone+'</button>'+
      '<button class="iconbtn" title="More">'+svgDots+'</button>'+
    '</div>'+
    '<div id="messages"><div id="msgsInner"></div></div>'+
    '<div id="inputbar">'+
      '<button class="iconbtn" title="Attach">'+svgClip+'</button>'+
      '<input id="msgInput" placeholder="Write a message..." autocomplete="off">'+
      '<button class="iconbtn" title="Emoji">'+svgSmile+'</button>'+
      '<button class="iconbtn" title="Voice">'+svgMic+'</button>'+
    '</div>';

  renderMessages(c);
  const input=$('msgInput');
  input.focus();
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(c); });
}

/* inline SVG icons used in the header / input bar */
const svgSearch='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>';
const svgPhone='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.5 2.9.7a2 2 0 0 1 1.6 2z"/></svg>';
const svgDots='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';
const svgClip='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 1 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"/></svg>';
const svgSmile='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>';
const svgMic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';

/* one date bubble — everything seeded as "Today" for realism */
function renderMessages(c){
  const inner=$('msgsInner');
  inner.innerHTML='<div class="datebubble">Today</div>';
  for(const m of c.messages) inner.appendChild(bubble(c,m));
  scrollBottom();
}
function bubble(c,m){
  const d=document.createElement('div');
  d.className='msg '+(m.from==='me'?'out':'in');
  let head='';
  if(m.from!=='me' && c.group) head='<div class="sender" style="color:'+m.color+'">'+esc(m.sender)+'</div>';
  // own messages carry ticks; start grey "sent", flip blue "read" shortly after
  const ticks=m.from==='me'
    ? '<span class="meta">'+m.time+' <span class="ticks sent" data-tick>✓✓</span></span>'
    : '<span class="meta">'+m.time+'</span>';
  d.innerHTML=head+'<span class="body">'+esc(m.text)+'</span>'+ticks+'<div class="clear"></div>';
  return d;
}
function scrollBottom(){
  const box=$('messages');
  if(box) box.scrollTop=box.scrollHeight;
}

/* ================================================================
   SEND + TYPING + AUTO-REPLY
   ================================================================ */
function sendMessage(c){
  const input=$('msgInput');
  const text=input.value.trim();
  if(!text) return;
  input.value='';

  // 1) append my message with grey "sent" ticks
  const m={from:'me', text, time:nowTime()};
  c.messages.push(m);
  const inner=$('msgsInner');
  const el=bubble(c,m);
  inner.appendChild(el);
  scrollBottom();

  // 2) animate: single ✓ -> double ✓✓, then grey -> blue (read)
  const tickEl=el.querySelector('[data-tick]');
  setTimeout(()=>{ tickEl.textContent='✓✓'; }, 400);
  setTimeout(()=>{ tickEl.classList.remove('sent'); tickEl.classList.add('read'); }, 1200);

  // 3) channels don't reply; Saved Messages just sits there
  if(c.channel || c.id==='saved'){ renderList($('search').value); return; }

  // 4) show "typing..." in the header, then deliver a canned reply
  const status=$('cstatus');
  const realStatus=c.status;
  setTimeout(()=>{
    if(activeId!==c.id) return;               // user switched chats — stay silent
    status.textContent='typing...';
    status.classList.add('typing');
  }, 600);
  setTimeout(()=>{
    if(activeId!==c.id){ status.textContent=realStatus; status.classList.remove('typing'); return; }
    status.textContent=realStatus;
    status.classList.remove('typing');
    const replies=c.replies.length?c.replies:['Got it 👍'];
    const i=(replyIndex[c.id]||0)%replies.length;
    replyIndex[c.id]=(replyIndex[c.id]||0)+1;
    const rm={from:'them', text:replies[i], time:nowTime()};
    // group replies come from a rotating member with their color
    if(c.group){
      const members=[['Priya','#d45246'],['Rahul','#2f80ed'],['Sneha','#7b4b94']];
      const [nm,col]=members[replyIndex[c.id]%members.length];
      rm.sender=nm; rm.color=col;
    }
    c.messages.push(rm);
    $('msgsInner').appendChild(bubble(c,rm));
    scrollBottom();
    renderList($('search').value);
  }, 1500);
}

/* ---------- boot ---------- */
renderList();
</script>
</body>
</html>
